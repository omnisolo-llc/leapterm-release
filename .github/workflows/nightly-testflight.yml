name: Nightly TestFlight Build

on:
  schedule:
    # Nightly & midday: 02:00 UTC and 14:00 UTC (twice a day)
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Platform targets (ios or all)'
        type: choice
        options: [ios, all]
        default: ios

permissions:
  contents: read
  actions: write

concurrency:
  group: nightly-testflight
  cancel-in-progress: false

jobs:
  dispatch_nightly:
    name: Dispatch Nightly TestFlight Build
    if: github.repository == 'omnisolo-llc/leapterm-release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release-source-approval
    timeout-minutes: 15
    steps:
      - name: Checkout builder repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node for App Store Connect query
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'

      - name: Query next build number and dispatch release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN || github.token }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPROVED_SOURCE_SHA: ${{ vars.APPROVED_RELEASE_SOURCE_SHA }}
          APPROVED_BUILDER_SHA: ${{ vars.APPROVED_RELEASE_BUILDER_SHA }}
          TARGET: ${{ inputs.target || 'ios' }}
        run: node ci/nightly-testflight-dispatch.mjs
