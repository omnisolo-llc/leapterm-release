name: Twice-Daily Release & TestFlight Build

on:
  schedule:
    # Twice a day: 02:00 UTC and 14:00 UTC
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Platform release wave (all publishes public release + TestFlight + Play Internal)'
        type: choice
        options: [all, slow, fast]
        default: all
      version:
        description: 'Optional semver override (leave empty to auto-increment next patch version)'
        required: false
        type: string
        default: ''
      build_number:
        description: 'Optional build number override (leave empty to auto-increment past TestFlight & staged builds)'
        required: false
        type: string
        default: ''
      source_sha:
        description: 'Optional source commit SHA override (leave empty to build latest main)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: nightly-testflight
  cancel-in-progress: false

jobs:
  dispatch_nightly:
    name: Dispatch Twice-Daily Release & TestFlight Build
    if: github.repository == 'omnisolo-llc/leapterm-release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release-source-approval
    timeout-minutes: 15
    steps:
      - name: Checkout builder repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node for App Store Connect & release discovery
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Verify twice-daily dispatcher contracts
        run: node --test ci/test_nightly_testflight_dispatch.mjs

      - name: Resolve next version & build number and dispatch release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN || github.token }}
          PRIVATE_RELEASE_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPLE_CONFIG: ${{ secrets.APPLE_CONFIG }}
          TARGET: ${{ inputs.target || 'all' }}
          INPUT_VERSION: ${{ inputs.version || '' }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number || '' }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha || '' }}
        run: node ci/nightly-testflight-dispatch.mjs
