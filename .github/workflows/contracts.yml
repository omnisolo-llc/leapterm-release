name: Public contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    if: github.repository == 'omnisolo-llc/leapterm-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce standard-runner policy before allocating the contracts matrix
        run: >-
          bash ci/native-release/run.sh audit-runners
          --workflows .github/workflows/contracts.yml
          --policy ci/standard-runner-policy.json

  contracts:
    # Preserve the required check contexts during the runner upgrade. The
    # Windows check keeps its historical name; the actual runner is 2025.
    name: contracts (${{ matrix.check }})
    needs: policy
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-26]
        include:
          - runner: ubuntu-24.04
            check: ubuntu-24.04
          - runner: windows-2025
            check: windows-2022
          - runner: macos-26
            check: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test launcher and encryption contracts without credentials
        shell: bash
        run: |
          bash ci/test-native-release.sh
          node --test ci/test_sealed_diagnostics.cjs ci/test_sealed_evaluation.cjs
