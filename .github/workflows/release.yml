  external_windows_signing:
    name: Actual Windows Azure signing acceptance
    needs: [resolve, publication_prepare, external_tests]
    if: github.repository == 'omnisolo-llc/leapterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only && inputs.release_route == 'legacy-acceptance'
    environment: external-windows-signing
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Prepare hash-pinned Windows Artifact Signing client and dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $destination = Join-Path $env:RUNNER_TEMP ('external-artifact-signing-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $destination | Out-Null
          $archive = Join-Path $destination 'client.zip'
          Invoke-WebRequest -Uri 'https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.128/microsoft.artifactsigning.client.1.0.128.nupkg' -OutFile $archive -TimeoutSec 120
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne '74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b') { throw 'Artifact Signing client hash mismatch' }
          $package = Join-Path $destination 'package'
          Expand-Archive -LiteralPath $archive -DestinationPath $package
          $libraries = @(Get-ChildItem -LiteralPath $package -Recurse -File -Filter 'Azure.CodeSigning.Dlib.dll' | Where-Object { $_.FullName -match '[\\/](?:x64|win-x64)[\\/]' })
          if ($libraries.Count -ne 1) { throw 'One actual x64 signing library is required' }
          $dlib = $libraries[0].FullName
          if (-not ((dotnet --list-runtimes) -match '^Microsoft\.NETCore\.App 8\.')) { throw '.NET 8 runtime is required' }
          "LEAP_WINDOWS_ARTIFACT_SIGNING_DLIB=$dlib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
