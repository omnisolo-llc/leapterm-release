name: Release

on:
  workflow_dispatch:
    inputs:
      release_route:
        description: 'Option1 publishes verified candidates; legacy acceptance retains the complete protected acceptance branch'
        type: choice
        options: [option1, legacy-acceptance]
        default: option1
      build_only:
        description: 'Verify builds: no release publication or production signing; optional self-signed Windows preview'
        type: boolean
        default: true
      verify_target:
        description: 'Platform selection: all, fast (linux/android/web), slow (windows/macos/ios), or build-only single platform'
        type: choice
        options: [all, fast, slow, linux, windows, macos, android, web, ios]
        default: all
      preview_windows_self_sign:
        description: 'Windows build-only: retain a recipient-encrypted evaluation ZIP privately for seven days'
        type: boolean
        default: false
      source_sha:
        description: 'Optional full source SHA on private main ancestry; empty selects the latest main once'
        required: false
        type: string
        default: ''
      builder_sha:
        description: 'Optional expected builder SHA; empty selects this workflow commit; the source gitlink must match'
        required: false
        type: string
        default: ''
      version:
        description: 'Release version (major.minor.patch)'
        required: false
        type: string
        default: '0.1.0'
      build_number:
        description: 'Fresh shared app build number (1-9999)'
        required: true
        type: string
      ios_action:
        description: 'Full releases require upload or submit; build-only requires skip'
        type: choice
        options: [skip, upload, submit]
        default: skip
      automatic_release:
        description: 'Release after approval (submit mode only)'
        type: boolean
        default: false
      include_selfhost:
        description: 'Include optional self-hosted relay bundle (disabled by default)'
        type: boolean
        default: false
      auto_promote:
        description: 'Candidate promotion: automatically promote verified candidate to internal tracks (TestFlight Internal & Play Store Internal) upon completion. Never releases directly to public users.'
        type: boolean
        default: false
      run_test:
        description: 'Run consistent launcher, release-tool, and platform tests on every selected platform'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.build_only && format('verify-{0}', github.run_id) || format('release-{0}', inputs.verify_target) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release_source_approval:
    # Historical job ID retained for existing status/dependency consumers.
    # Access is enforced by the admin-only GitHub Actions execution policy.
    name: Validate release request automatically
    if: ${{ github.repository == 'omnisolo-llc/leapterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only }}
    environment: release-source-approval
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.approve.outputs.source_sha }}
      builder_sha: ${{ steps.approve.outputs.builder_sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source selection and executing builder without manual approvals
        id: approve
        run: bash ci/native-release/run.sh validate-request
        env:
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          GITHUB_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: main

  resolve:
    name: Resolve release inputs
    needs: [release_source_approval]
    if: ${{ !cancelled() && github.repository == 'omnisolo-llc/leapterm-release' && github.ref == 'refs/heads/main' && (inputs.build_only || needs.release_source_approval.result == 'success') }}
    environment: downloads
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.resolve.outputs.version }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      workflow_id: ${{ steps.resolve.outputs.workflow_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve source revision and defaults
        id: resolve
        run: bash ci/native-release/run.sh resolve
        env:
          RELEASE_TARGET: resolve
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}

  windows_sdk:
    name: Build and retain source-bound Windows SDK
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' && github.repository == 'omnisolo-llc/leapterm-release' && github.ref == 'refs/heads/main' && ((!inputs.build_only && inputs.verify_target != 'fast') || inputs.verify_target == 'all' || inputs.verify_target == 'slow' || inputs.verify_target == 'windows') }}
    environment: downloads
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.sdk.outputs.manifest_sha256 }}
      source_sha: ${{ steps.sdk.outputs.source_sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Install native Windows cross compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 cmake ninja-build make perl gawk pkg-config curl patch llvm
      - name: Cache Windows cross-compiled SDK
        id: sdk_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/windows-native-sdk
            ${{ runner.temp }}/windows-native-sdk-source
          key: windows-native-sdk-v1-${{ runner.os }}-${{ needs.resolve.outputs.source_sha }}
          restore-keys: |
            windows-native-sdk-v1-${{ runner.os }}-${{ needs.resolve.outputs.source_sha }}
            windows-native-sdk-v1-${{ runner.os }}-
      - name: Cache sccache compiler objects
        id: sccache_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-v1-${{ runner.os }}-windows-sdk-${{ needs.resolve.outputs.source_sha }}-${{ github.run_id }}
          restore-keys: |
            sccache-v1-${{ runner.os }}-windows-sdk-${{ needs.resolve.outputs.source_sha }}-
      - name: Cache Cargo registry and native stage tools
        id: cargo_registry_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-registry-cache
            ${{ runner.temp }}/leap-launcher-cache
            ${{ runner.temp }}/leap-native-stage-cache
          key: cargo-registry-v1-${{ runner.os }}-${{ needs.resolve.outputs.source_sha }}-${{ github.run_id }}
          restore-keys: |
            cargo-registry-v1-${{ runner.os }}-${{ needs.resolve.outputs.source_sha }}-
      - name: Install pinned sccache compiler launcher
        id: sccache
        run: node ci/install-sccache.mjs windows-sdk
      - name: Produce and retain the complete reviewed SDK privately
        id: sdk
        run: bash ci/native-release/run.sh windows-sdk
        env:
          RELEASE_TARGET: windows
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          SOURCE_SUBMODULE_DEPLOY_KEY_BASE64: ${{ secrets.SOURCE_SUBMODULE_DEPLOY_KEY_BASE64 }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
          SCCACHE_DIR: ${{ format('{0}/sccache', runner.temp) }}
          SCCACHE_CONF: ${{ format('{0}/sccache/sccache-config.toml', runner.temp) }}
          SCCACHE_CACHED_CONF: ${{ format('{0}/sccache/sccache-cached-config.toml', runner.temp) }}
          CARGO_REGISTRY_CACHE_DIR: ${{ format('{0}/cargo-registry-cache', runner.temp) }}
          LEAP_LAUNCHER_CACHE_DIR: ${{ format('{0}/leap-launcher-cache', runner.temp) }}
          LEAP_NATIVE_STAGE_CACHE_DIR: ${{ format('{0}/leap-native-stage-cache', runner.temp) }}
          RUSTC_WRAPPER: ${{ steps.sccache.outputs.wrapper || '' }}
          CARGO_BUILD_RUSTC_WRAPPER: ${{ steps.sccache.outputs.wrapper || '' }}
          LEAP_C_COMPILER_LAUNCHER: ${{ steps.sccache.outputs.wrapper || '' }}
      - name: Retain encrypted diagnostics privately
        if: ${{ always() }}
        run: bash ci/native-release/run.sh retain-artifacts
        env:
          RELEASE_TARGET: windows
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          SOURCE_SUBMODULE_DEPLOY_KEY_BASE64: ${{ secrets.SOURCE_SUBMODULE_DEPLOY_KEY_BASE64 }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          RELEASE_ARTIFACT_KIND: diagnostics
          RELEASE_ARTIFACT_SCOPE: windows-sdk
          CARGO_REGISTRY_CACHE_DIR: ${{ format('{0}/cargo-registry-cache', runner.temp) }}
          LEAP_LAUNCHER_CACHE_DIR: ${{ format('{0}/leap-launcher-cache', runner.temp) }}
          LEAP_NATIVE_STAGE_CACHE_DIR: ${{ format('{0}/leap-native-stage-cache', runner.temp) }}

  integration:
    name: Actual ${{ matrix.platform }} application integration
    needs: [resolve, windows_sdk]
    if: github.repository == 'omnisolo-llc/leapterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only && inputs.release_route == 'legacy-acceptance'
    environment: downloads
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            device_variable: LEAP_INTEGRATION_DEVICE_LINUX
            default_device: linux
            defines_variable: LEAP_INTEGRATION_DEFINES_LINUX
            source_profile_secret: LEAP_PROTECTED_DESKTOP_SOURCE_PROFILE_LINUX_JSON
            source_profile_digest_variable: LEAP_PROTECTED_DESKTOP_SOURCE_PROFILE_LINUX_SHA256
          - platform: macos
            runner: macos-26
            device_variable: LEAP_INTEGRATION_DEVICE_MACOS
            default_device: macos
            defines_variable: LEAP_INTEGRATION_DEFINES_MACOS
            source_profile_secret: LEAP_PROTECTED_DESKTOP_SOURCE_PROFILE_MACOS_JSON
            source_profile_digest_variable: LEAP_PROTECTED_DESKTOP_SOURCE_PROFILE_MACOS_SHA256
          - platform: windows
            runner: windows-2025
            device_variable: LEAP_INTEGRATION_DEVICE_WINDOWS
            default_device: windows
            defines_variable: LEAP_INTEGRATION_DEFINES_WINDOWS
            source_profile_secret: LEAP_PROTECTED_DESKTOP_SOURCE_PROFILE_WINDOWS_JSON
            source_profile_digest_variable: LEAP_PROTECTED_DESKTOP_SOURCE_PROFILE_WINDOWS_SHA256
          - platform: android
            runner: ubuntu-24.04
            device_variable: LEAP_INTEGRATION_DEVICE_ANDROID
            default_device: ''
            defines_variable: LEAP_INTEGRATION_DEFINES_ANDROID
            source_profile_secret: LEAP_PROTECTED_DESKTOP_SOURCE_PROFILE_ANDROID_JSON
            source_profile_digest_variable: LEAP_PROTECTED_DESKTOP_SOURCE_PROFILE_ANDROID_SHA256
          - platform: ios
            runner: macos-26
            device_variable: LEAP_INTEGRATION_DEVICE_IOS
            default_device: ''
            defines_variable: LEAP_INTEGRATION_DEFINES_IOS
            source_profile_secret: LEAP_PROTECTED_DESKTOP_SOURCE_PROFILE_IOS_JSON
            source_profile_digest_variable: LEAP_PROTECTED_DESKTOP_SOURCE_PROFILE_IOS_SHA256
          - platform: web
            runner: ubuntu-24.04
            device_variable: LEAP_INTEGRATION_DEVICE_WEB
            default_device: chrome
            defines_variable: LEAP_INTEGRATION_DEFINES_WEB
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Materialize the original protected source pair profile
        id: protected_source_pair
        run: bash ci/native-release/run.sh prepare-protected-source-pair
        env:
          LEAP_INTEGRATION_PLATFORM: ${{ matrix.platform }}
          LEAP_PROTECTED_DESKTOP_SOURCE_PROFILE_JSON: ${{ matrix.source_profile_secret && secrets[matrix.source_profile_secret] || '' }}
          LEAP_PROTECTED_DESKTOP_SOURCE_PROFILE_SHA256: ${{ matrix.source_profile_digest_variable && vars[matrix.source_profile_digest_variable] || '' }}
      # Presence flags are not credentials and are not execution evidence.
      # Missing physical-device/fixture inputs fail here, not after a queue timeout.
      - name: Check integration prerequisites without exposing configuration
        run: bash ci/native-release/run.sh check-integration-prerequisites
        env:
          RELEASE_PREREQUISITE_PRESENCE: >-
            {"SOURCE_REPOSITORY":${{ secrets.SOURCE_REPOSITORY != '' }},
             "SOURCE_BRANCH":${{ secrets.SOURCE_BRANCH != '' }},
             "SOURCE_DEPLOY_KEY":${{ secrets.SOURCE_DEPLOY_KEY != '' }},
             "SOURCE_KNOWN_HOSTS":${{ secrets.SOURCE_KNOWN_HOSTS != '' }},
             "BUILD_CONFIG":${{ secrets.BUILD_CONFIG != '' }},
             "STORAGE_CONFIG":${{ secrets.STORAGE_CONFIG != '' }},
             "LEAPTERM_VPN_PROVIDER_PUBLIC_KEY":${{ vars.LEAPTERM_VPN_PROVIDER_PUBLIC_KEY != '' }},
             "LEAP_INTEGRATION_DEVICE":${{ (vars[matrix.device_variable] || matrix.default_device) != '' }}}
      - name: Execute genuine reviewed application journeys and retain private evidence
        run: bash ci/native-release/run.sh run
        env:
          RELEASE_TARGET: integration
          LEAPTERM_WINDOWS_SDK_MANIFEST_SHA256: ${{ needs.windows_sdk.outputs.manifest_sha256 }}
          LEAPTERM_VPN_PROVIDER_PUBLIC_KEY: ${{ vars.LEAPTERM_VPN_PROVIDER_PUBLIC_KEY }}
          LEAP_WINDOWS_SUITE_PUBLISHER_KEY_BASE64: ${{ vars.LEAP_WINDOWS_SUITE_PUBLISHER_KEY_BASE64 }}
          LEAP_WINDOWS_SUITE_APPROVAL_KEY_BASE64: ${{ vars.LEAP_WINDOWS_SUITE_APPROVAL_KEY_BASE64 }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          SOURCE_SUBMODULE_DEPLOY_KEY_BASE64: ${{ secrets.SOURCE_SUBMODULE_DEPLOY_KEY_BASE64 }}
          BUILD_CONFIG: ${{ secrets.BUILD_CONFIG }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          LEAP_INTEGRATION_PLATFORM: ${{ matrix.platform }}
          LEAP_INTEGRATION_DEVICE: ${{ vars[matrix.device_variable] || matrix.default_device }}
          LEAP_INTEGRATION_DEFINES: ${{ vars[matrix.defines_variable] }}
          LEAP_PROTECTED_DESKTOP_SOURCE_PROFILE_FILE: ${{ steps.protected_source_pair.outputs.profile_file }}
          LEAP_PROTECTED_DESKTOP_SOURCE_PROFILE_SHA256: ${{ matrix.source_profile_digest_variable && vars[matrix.source_profile_digest_variable] || '' }}
          LEAP_CHROMEDRIVER_PORT: ${{ vars.LEAP_CHROMEDRIVER_PORT }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
      - name: Remove the protected source pair input
        if: ${{ always() }}
        run: bash ci/native-release/run.sh cleanup-hosted-inputs
        env:
          LEAP_PROTECTED_DESKTOP_SOURCE_PROFILE_FILE: ${{ steps.protected_source_pair.outputs.profile_file }}
      - name: Retain encrypted diagnostics privately
        if: ${{ always() }}
        run: bash ci/native-release/run.sh retain-artifacts
        env:
          RELEASE_TARGET: integration
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          SOURCE_SUBMODULE_DEPLOY_KEY_BASE64: ${{ secrets.SOURCE_SUBMODULE_DEPLOY_KEY_BASE64 }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          RELEASE_ARTIFACT_KIND: diagnostics
          RELEASE_ARTIFACT_SCOPE: integration-${{ matrix.platform }}

  linux_track:
    name: Linux track (${{ needs.resolve.outputs.workflow_id }})
    needs: [resolve]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (inputs.verify_target == 'all' || inputs.verify_target == 'fast' || inputs.verify_target == 'linux') && github.repository == 'omnisolo-llc/leapterm-release' && github.ref == 'refs/heads/main' }}
    continue-on-error: true
    environment: downloads
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Cache sccache compiler objects
        id: sccache_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-v1-${{ runner.os }}-linux-${{ needs.resolve.outputs.source_sha }}-${{ github.run_id }}
          restore-keys: |
            sccache-v1-${{ runner.os }}-linux-${{ needs.resolve.outputs.source_sha }}-
      - name: Cache Cargo registry and native stage tools
        id: cargo_registry_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-registry-cache
            ${{ runner.temp }}/leap-launcher-cache
            ${{ runner.temp }}/leap-native-stage-cache
          key: cargo-registry-v1-${{ runner.os }}-${{ needs.resolve.outputs.source_sha }}-${{ github.run_id }}
          restore-keys: |
            cargo-registry-v1-${{ runner.os }}-${{ needs.resolve.outputs.source_sha }}-
      - name: Cache pinned Flutter SDK git clone
        id: flutter_sdk_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/flutter-sdk-cache
          key: flutter-sdk-v1-${{ runner.os }}-${{ needs.resolve.outputs.source_sha }}
          restore-keys: |
            flutter-sdk-v1-${{ runner.os }}-${{ needs.resolve.outputs.source_sha }}
            flutter-sdk-v1-${{ runner.os }}-
      - name: Cache Dart pub packages
        id: pub_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pub-cache
          key: pub-cache-v1-${{ runner.os }}-linux-${{ needs.resolve.outputs.source_sha }}-${{ github.run_id }}
          restore-keys: |
            pub-cache-v1-${{ runner.os }}-linux-${{ needs.resolve.outputs.source_sha }}-
            pub-cache-v1-${{ runner.os }}-linux-
      - name: Cache Linux FreeRDP SDK
        id: linux_freerdp_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/linux-freerdp-cache
          key: linux-freerdp-v1-${{ runner.os }}-linux-${{ needs.resolve.outputs.source_sha }}
          restore-keys: |
            linux-freerdp-v1-${{ runner.os }}-linux-${{ needs.resolve.outputs.source_sha }}
            linux-freerdp-v1-${{ runner.os }}-linux-
      - name: Install pinned sccache compiler launcher
        id: sccache
        run: node ci/install-sccache.mjs linux
      - name: Install pinned native verification toolchain
        if: ${{ inputs.run_test }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --no-self-update
      - name: Verify public launcher contracts
        if: ${{ inputs.run_test }}
        run: |
          bash ci/test-native-release.sh
          node --test ci/test_sealed_diagnostics.cjs ci/test_sealed_evaluation.cjs ci/test_promote_release.mjs ci/test_verify_agent_install_e2e.mjs
      - name: Verify build without publishing
        id: public_candidates
        run: bash ci/native-release/run.sh verify-build
        env:
          RELEASE_TARGET: linux
          LEAPTERM_VPN_PROVIDER_PUBLIC_KEY: ${{ vars.LEAPTERM_VPN_PROVIDER_PUBLIC_KEY }}
          LEAP_WINDOWS_SUITE_PUBLISHER_KEY_BASE64: ${{ vars.LEAP_WINDOWS_SUITE_PUBLISHER_KEY_BASE64 }}
          LEAP_WINDOWS_SUITE_APPROVAL_KEY_BASE64: ${{ vars.LEAP_WINDOWS_SUITE_APPROVAL_KEY_BASE64 }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          SOURCE_SUBMODULE_DEPLOY_KEY_BASE64: ${{ secrets.SOURCE_SUBMODULE_DEPLOY_KEY_BASE64 }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
          BUILD_CONFIG: ${{ !inputs.build_only && secrets.BUILD_CONFIG || '{}' }}
          STORAGE_CONFIG: ${{ !inputs.build_only && secrets.STORAGE_CONFIG || '' }}
          SCCACHE_DIR: ${{ format('{0}/sccache', runner.temp) }}
          SCCACHE_CONF: ${{ format('{0}/sccache/sccache-config.toml', runner.temp) }}
          SCCACHE_CACHED_CONF: ${{ format('{0}/sccache/sccache-cached-config.toml', runner.temp) }}
          CARGO_REGISTRY_CACHE_DIR: ${{ format('{0}/cargo-registry-cache', runner.temp) }}
          LEAP_LAUNCHER_CACHE_DIR: ${{ format('{0}/leap-launcher-cache', runner.temp) }}
          LEAP_NATIVE_STAGE_CACHE_DIR: ${{ format('{0}/leap-native-stage-cache', runner.temp) }}
          FLUTTER_SDK_CACHE_DIR: ${{ format('{0}/flutter-sdk-cache', runner.temp) }}
          PUB_CACHE_DIR: ${{ format('{0}/pub-cache', runner.temp) }}
          LEAP_LINUX_FREERDP_CACHE_DIR: ${{ format('{0}/linux-freerdp-cache', runner.temp) }}
