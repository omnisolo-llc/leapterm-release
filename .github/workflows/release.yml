name: Release

on:
  workflow_dispatch:
    inputs:
      release_route:
        description: 'Option1 publishes verified candidates; legacy acceptance retains the complete protected acceptance branch'
        type: choice
        options: [option1, legacy-acceptance]
        default: option1
      build_only:
        description: 'Verify builds: no release publication or production signing; optional self-signed Windows preview'
        type: boolean
        default: true
      verify_target:
        description: 'Build-only platform selection; actual releases always build all platforms'
        type: choice
        options: [all, linux, windows, macos, android, web, ios]
        default: all
      preview_windows_self_sign:
        description: 'Windows build-only: retain a recipient-encrypted evaluation ZIP privately for seven days'
        type: boolean
        default: false
      source_sha:
        description: 'Optional full source SHA on private main ancestry; empty selects the latest main once'
        required: false
        type: string
        default: ''
      builder_sha:
        description: 'Optional expected builder SHA; empty selects this workflow commit; the source gitlink must match'
        required: false
        type: string
        default: ''
      version:
        description: 'Release version (major.minor.patch)'
        required: false
        type: string
        default: '0.1.0'
      build_number:
        description: 'Fresh shared app build number (1-9999)'
        required: true
        type: string
      ios_action:
        description: 'Full releases require upload or submit; build-only requires skip'
        type: choice
        options: [skip, upload, submit]
        default: skip
      automatic_release:
        description: 'Release after approval (submit mode only)'
        type: boolean
        default: false
      include_selfhost:
        description: 'Full releases require the kit; only build-only validation may omit it'
        type: boolean
        default: true
      auto_promote:
        description: 'Candidate promotion: automatically promote verified candidate to pre-release tracks (TestFlight & Play Store Internal) upon completion. Never releases directly to users.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.build_only && format('verify-{0}', github.run_id) || 'release' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release_source_approval:
    # Historical job ID retained for existing status/dependency consumers.
    # Access is enforced by the admin-only GitHub Actions execution policy.
    name: Validate release request automatically
    if: ${{ github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only }}
    environment: release-source-approval
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.approve.outputs.source_sha }}
      builder_sha: ${{ steps.approve.outputs.builder_sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source selection and executing builder without manual approvals
        id: approve
        run: bash ci/native-release/run.sh validate-request
        env:
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          GITHUB_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: omnisolo-llc/omniterm
          SOURCE_BRANCH: main

  resolve:
    name: Resolve release inputs
    needs: [release_source_approval]
    if: ${{ !cancelled() && github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main' && (inputs.build_only || needs.release_source_approval.result == 'success') }}
    environment: downloads
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.resolve.outputs.version }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      workflow_id: ${{ steps.resolve.outputs.workflow_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve source revision and defaults
        id: resolve
        run: bash ci/native-release/run.sh resolve
        env:
          RELEASE_TARGET: resolve
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}

  windows_sdk:
    name: Build and retain source-bound Windows SDK
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' && github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main' && (!inputs.build_only || inputs.verify_target == 'all' || inputs.verify_target == 'windows') }}
    environment: downloads
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.sdk.outputs.manifest_sha256 }}
      source_sha: ${{ steps.sdk.outputs.source_sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Install native Windows cross compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 cmake ninja-build make perl gawk pkg-config curl patch llvm
      - name: Cache Windows cross-compiled SDK
        id: sdk_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/windows-native-sdk
            ${{ runner.temp }}/windows-native-sdk-source
          key: windows-native-sdk-v1-${{ runner.os }}-${{ needs.resolve.outputs.source_sha }}
          restore-keys: |
            windows-native-sdk-v1-${{ runner.os }}-
      - name: Produce and retain the complete reviewed SDK privately
        id: sdk
        run: bash ci/native-release/run.sh windows-sdk
        env:
          RELEASE_TARGET: windows
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          SOURCE_SUBMODULE_DEPLOY_KEY_BASE64: ${{ secrets.SOURCE_SUBMODULE_DEPLOY_KEY_BASE64 }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
      - name: Retain encrypted diagnostics privately
        if: ${{ always() }}
        run: bash ci/native-release/run.sh retain-artifacts
        env:
          RELEASE_TARGET: windows
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          SOURCE_SUBMODULE_DEPLOY_KEY_BASE64: ${{ secrets.SOURCE_SUBMODULE_DEPLOY_KEY_BASE64 }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          RELEASE_ARTIFACT_KIND: diagnostics
          RELEASE_ARTIFACT_SCOPE: windows-sdk

  integration:
    name: Actual ${{ matrix.platform }} application integration
    needs: [resolve, windows_sdk]
    if: github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only && inputs.release_route == 'legacy-acceptance'
    environment: downloads
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            device_variable: OMNI_INTEGRATION_DEVICE_LINUX
            default_device: linux
            defines_variable: OMNI_INTEGRATION_DEFINES_LINUX
            source_profile_secret: OMNI_PROTECTED_DESKTOP_SOURCE_PROFILE_LINUX_JSON
            source_profile_digest_variable: OMNI_PROTECTED_DESKTOP_SOURCE_PROFILE_LINUX_SHA256
          - platform: macos
            runner: macos-26
            device_variable: OMNI_INTEGRATION_DEVICE_MACOS
            default_device: macos
            defines_variable: OMNI_INTEGRATION_DEFINES_MACOS
            source_profile_secret: OMNI_PROTECTED_DESKTOP_SOURCE_PROFILE_MACOS_JSON
            source_profile_digest_variable: OMNI_PROTECTED_DESKTOP_SOURCE_PROFILE_MACOS_SHA256
          - platform: windows
            runner: windows-2025
            device_variable: OMNI_INTEGRATION_DEVICE_WINDOWS
            default_device: windows
            defines_variable: OMNI_INTEGRATION_DEFINES_WINDOWS
            source_profile_secret: OMNI_PROTECTED_DESKTOP_SOURCE_PROFILE_WINDOWS_JSON
            source_profile_digest_variable: OMNI_PROTECTED_DESKTOP_SOURCE_PROFILE_WINDOWS_SHA256
          - platform: android
            runner: ubuntu-24.04
            device_variable: OMNI_INTEGRATION_DEVICE_ANDROID
            default_device: ''
            defines_variable: OMNI_INTEGRATION_DEFINES_ANDROID
            source_profile_secret: OMNI_PROTECTED_DESKTOP_SOURCE_PROFILE_ANDROID_JSON
            source_profile_digest_variable: OMNI_PROTECTED_DESKTOP_SOURCE_PROFILE_ANDROID_SHA256
          - platform: ios
            runner: macos-26
            device_variable: OMNI_INTEGRATION_DEVICE_IOS
            default_device: ''
            defines_variable: OMNI_INTEGRATION_DEFINES_IOS
            source_profile_secret: OMNI_PROTECTED_DESKTOP_SOURCE_PROFILE_IOS_JSON
            source_profile_digest_variable: OMNI_PROTECTED_DESKTOP_SOURCE_PROFILE_IOS_SHA256
          - platform: web
            runner: ubuntu-24.04
            device_variable: OMNI_INTEGRATION_DEVICE_WEB
            default_device: chrome
            defines_variable: OMNI_INTEGRATION_DEFINES_WEB
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Materialize the original protected source pair profile
        id: protected_source_pair
        run: bash ci/native-release/run.sh prepare-protected-source-pair
        env:
          OMNI_INTEGRATION_PLATFORM: ${{ matrix.platform }}
          OMNI_PROTECTED_DESKTOP_SOURCE_PROFILE_JSON: ${{ matrix.source_profile_secret && secrets[matrix.source_profile_secret] || '' }}
          OMNI_PROTECTED_DESKTOP_SOURCE_PROFILE_SHA256: ${{ matrix.source_profile_digest_variable && vars[matrix.source_profile_digest_variable] || '' }}
      # Presence flags are not credentials and are not execution evidence.
      # Missing physical-device/fixture inputs fail here, not after a queue timeout.
      - name: Check integration prerequisites without exposing configuration
        run: bash ci/native-release/run.sh check-integration-prerequisites
        env:
          RELEASE_PREREQUISITE_PRESENCE: >-
            {"SOURCE_REPOSITORY":${{ secrets.SOURCE_REPOSITORY != '' }},
             "SOURCE_BRANCH":${{ secrets.SOURCE_BRANCH != '' }},
             "SOURCE_DEPLOY_KEY":${{ secrets.SOURCE_DEPLOY_KEY != '' }},
             "SOURCE_KNOWN_HOSTS":${{ secrets.SOURCE_KNOWN_HOSTS != '' }},
             "BUILD_CONFIG":${{ secrets.BUILD_CONFIG != '' }},
             "STORAGE_CONFIG":${{ secrets.STORAGE_CONFIG != '' }},
             "OMNITERM_VPN_PROVIDER_PUBLIC_KEY":${{ vars.OMNITERM_VPN_PROVIDER_PUBLIC_KEY != '' }},
             "OMNI_INTEGRATION_DEVICE":${{ (vars[matrix.device_variable] || matrix.default_device) != '' }}}
      - name: Execute genuine reviewed application journeys and retain private evidence
        run: bash ci/native-release/run.sh run
        env:
          RELEASE_TARGET: integration
          OMNITERM_WINDOWS_SDK_MANIFEST_SHA256: ${{ needs.windows_sdk.outputs.manifest_sha256 }}
          OMNITERM_VPN_PROVIDER_PUBLIC_KEY: ${{ vars.OMNITERM_VPN_PROVIDER_PUBLIC_KEY }}
          OMNI_WINDOWS_SUITE_PUBLISHER_KEY_BASE64: ${{ vars.OMNI_WINDOWS_SUITE_PUBLISHER_KEY_BASE64 }}
          OMNI_WINDOWS_SUITE_APPROVAL_KEY_BASE64: ${{ vars.OMNI_WINDOWS_SUITE_APPROVAL_KEY_BASE64 }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          SOURCE_SUBMODULE_DEPLOY_KEY_BASE64: ${{ secrets.SOURCE_SUBMODULE_DEPLOY_KEY_BASE64 }}
          BUILD_CONFIG: ${{ secrets.BUILD_CONFIG }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          OMNI_INTEGRATION_PLATFORM: ${{ matrix.platform }}
          OMNI_INTEGRATION_DEVICE: ${{ vars[matrix.device_variable] || matrix.default_device }}
          OMNI_INTEGRATION_DEFINES: ${{ vars[matrix.defines_variable] }}
          OMNI_PROTECTED_DESKTOP_SOURCE_PROFILE_FILE: ${{ steps.protected_source_pair.outputs.profile_file }}
          OMNI_PROTECTED_DESKTOP_SOURCE_PROFILE_SHA256: ${{ matrix.source_profile_digest_variable && vars[matrix.source_profile_digest_variable] || '' }}
          OMNI_CHROMEDRIVER_PORT: ${{ vars.OMNI_CHROMEDRIVER_PORT }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
      - name: Remove the protected source pair input
        if: ${{ always() }}
        run: bash ci/native-release/run.sh cleanup-hosted-inputs
        env:
          OMNI_PROTECTED_DESKTOP_SOURCE_PROFILE_FILE: ${{ steps.protected_source_pair.outputs.profile_file }}
      - name: Retain encrypted diagnostics privately
        if: ${{ always() }}
        run: bash ci/native-release/run.sh retain-artifacts
        env:
          RELEASE_TARGET: integration
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          SOURCE_SUBMODULE_DEPLOY_KEY_BASE64: ${{ secrets.SOURCE_SUBMODULE_DEPLOY_KEY_BASE64 }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          RELEASE_ARTIFACT_KIND: diagnostics
          RELEASE_ARTIFACT_SCOPE: integration-${{ matrix.platform }}

  verify:
    name: Verify ${{ matrix.target }} build (${{ needs.resolve.outputs.workflow_id }})
    needs: [resolve, windows_sdk]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.windows_sdk.result == 'success' || (needs.windows_sdk.result == 'skipped' && inputs.verify_target != 'all' && inputs.verify_target != 'windows')) && github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main' }}
    continue-on-error: true
    environment: downloads
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target: ${{ inputs.verify_target == 'all' && fromJSON('["linux","windows","macos","android","web","ios"]') || fromJSON(format('["{0}"]', inputs.verify_target)) }}
    runs-on: ${{ matrix.target == 'windows' && 'windows-2025' || ((matrix.target == 'macos' || matrix.target == 'ios') && 'macos-26' || 'ubuntu-24.04') }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17.0.20+101'
      - name: Install pinned native verification toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --no-self-update
      - name: Verify public launcher contracts
        run: |
          bash ci/test-native-release.sh
          node --test ci/test_sealed_diagnostics.cjs ci/test_sealed_evaluation.cjs
      - name: Prepare pinned Windows verification signing client
        if: ${{ !inputs.build_only && matrix.target == 'windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $root = Join-Path $env:RUNNER_TEMP 'artifact-signing'
          New-Item -ItemType Directory -Path $root | Out-Null
          $archive = Join-Path $root 'client.zip'
          Invoke-WebRequest -Uri 'https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.128/microsoft.artifactsigning.client.1.0.128.nupkg' -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne '74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b') { throw 'Artifact Signing client hash mismatch' }
          $package = Join-Path $root 'package'
          Expand-Archive -LiteralPath $archive -DestinationPath $package
          $dlib = Join-Path $package 'bin/x64/Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path -LiteralPath $dlib -PathType Leaf)) { throw 'Artifact Signing client is incomplete' }
          if (-not ((dotnet --list-runtimes) -match '^Microsoft\.NETCore\.App 8\.')) { throw '.NET 8 runtime is required for Artifact Signing' }
      - name: Verify build without publishing
        id: public_candidates
        run: bash ci/native-release/run.sh verify-build
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          OMNITERM_WINDOWS_SDK_MANIFEST_SHA256: ${{ needs.windows_sdk.outputs.manifest_sha256 }}
          OMNITERM_VPN_PROVIDER_PUBLIC_KEY: ${{ vars.OMNITERM_VPN_PROVIDER_PUBLIC_KEY }}
          OMNI_WINDOWS_SUITE_PUBLISHER_KEY_BASE64: ${{ vars.OMNI_WINDOWS_SUITE_PUBLISHER_KEY_BASE64 }}
          OMNI_WINDOWS_SUITE_APPROVAL_KEY_BASE64: ${{ vars.OMNI_WINDOWS_SUITE_APPROVAL_KEY_BASE64 }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          SOURCE_SUBMODULE_DEPLOY_KEY_BASE64: ${{ secrets.SOURCE_SUBMODULE_DEPLOY_KEY_BASE64 }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
          BUILD_CONFIG: ${{ !inputs.build_only && secrets.BUILD_CONFIG || '{}' }}
          SIGNING_CONFIG: ${{ !inputs.build_only && (matrix.target == 'windows' && secrets.WINDOWS_SIGNING_CONFIG || matrix.target == 'macos' && secrets.MACOS_SIGNING_CONFIG || matrix.target == 'android' && secrets.ANDROID_SIGNING_CONFIG || matrix.target == 'ios' && secrets.IOS_SIGNING_CONFIG || '') || '' }}
          OMNI_WINDOWS_ARTIFACT_SIGNING_DLIB: ${{ !inputs.build_only && matrix.target == 'windows' && format('{0}/artifact-signing/package/bin/x64/Azure.CodeSigning.Dlib.dll', runner.temp) || '' }}
          STORAGE_CONFIG: ${{ (!inputs.build_only || matrix.target == 'windows') && secrets.STORAGE_CONFIG || '' }}
          WINDOWS_PREVIEW_OUTPUT_DIR: ${{ inputs.preview_windows_self_sign && matrix.target == 'windows' && format('{0}/windows-preview', runner.temp) || '' }}
      - name: Retain recipient-encrypted Windows evaluation privately
        if: ${{ success() && inputs.preview_windows_self_sign && matrix.target == 'windows' }}
        run: bash ci/native-release/run.sh retain-artifacts
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          SOURCE_SUBMODULE_DEPLOY_KEY_BASE64: ${{ secrets.SOURCE_SUBMODULE_DEPLOY_KEY_BASE64 }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          RELEASE_ARTIFACT_KIND: evaluation
          RELEASE_ARTIFACT_SCOPE: verify-${{ matrix.target }}
      - name: Retain encrypted diagnostics privately
        if: ${{ always() }}
        run: bash ci/native-release/run.sh retain-artifacts
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          SOURCE_SUBMODULE_DEPLOY_KEY_BASE64: ${{ secrets.SOURCE_SUBMODULE_DEPLOY_KEY_BASE64 }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          RELEASE_ARTIFACT_KIND: diagnostics
          RELEASE_ARTIFACT_SCOPE: verify-${{ matrix.target }}

  validate:
    name: Validate release (${{ needs.resolve.outputs.workflow_id }})
    permissions:
      contents: write
    needs: [resolve, integration]
    if: github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only && inputs.release_route == 'legacy-acceptance'
    environment: downloads
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Install native HTTP/3 build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libicu-dev
      - name: Verify public launcher contracts
        run: bash ci/test-native-release.sh
      - name: Verify self-hosted relay package locks and suites
        run: |
          npm ci --prefix relay/native
          node --test --test-concurrency=1 ci/test_native_relay_contract.mjs
          npm ci --ignore-scripts --prefix relay/moq
          npm run native-build --prefix relay/moq
          npm test --prefix relay/moq
      - name: Validate reviewed source revision
        run: bash ci/native-release/run.sh run
        env:
          RELEASE_TARGET: validate
          OMNITERM_VPN_PROVIDER_PUBLIC_KEY: ${{ vars.OMNITERM_VPN_PROVIDER_PUBLIC_KEY }}
          OMNI_WINDOWS_SUITE_PUBLISHER_KEY_BASE64: ${{ vars.OMNI_WINDOWS_SUITE_PUBLISHER_KEY_BASE64 }}
          OMNI_WINDOWS_SUITE_APPROVAL_KEY_BASE64: ${{ vars.OMNI_WINDOWS_SUITE_APPROVAL_KEY_BASE64 }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
