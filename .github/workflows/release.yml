          LEAP_WINDOWS_SUITE_APPROVAL_KEY_BASE64: ${{ vars.LEAP_WINDOWS_SUITE_APPROVAL_KEY_BASE64 }}
          LEAP_EXTERNAL_PLATFORM: ${{ matrix.platform }}
          LEAP_EXTERNAL_CONFIG_FILE: ${{ vars[matrix.config_variable] }}
          LEAP_EXTERNAL_CANDIDATE_GUARD_CONFIG_FILE: ${{ vars[matrix.candidate_guard_variable] }}
          LEAP_MCP_STAGING_DEPLOYMENT_CONFIG_FILE: ${{ matrix.platform == 'linux' && vars.LEAP_MCP_STAGING_DEPLOYMENT_CONFIG_FILE || '' }}
          LEAP_MCP_STAGING_READ_TOKEN: ${{ matrix.platform == 'linux' && secrets.LEAP_MCP_STAGING_READ_TOKEN || '' }}
          LEAP_MCP_STAGING_WRITE_TOKEN: ${{ matrix.platform == 'linux' && secrets.LEAP_MCP_STAGING_WRITE_TOKEN || '' }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
