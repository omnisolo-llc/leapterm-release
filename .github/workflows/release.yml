          OMNI_EXTERNAL_CONFIG_FILE: ${{ vars[matrix.config_variable] }}
          OMNI_EXTERNAL_CANDIDATE_GUARD_CONFIG_FILE: ${{ vars[matrix.candidate_guard_variable] }}
          OMNI_MCP_STAGING_DEPLOYMENT_CONFIG_FILE: ${{ matrix.platform == 'linux' && vars.OMNI_MCP_STAGING_DEPLOYMENT_CONFIG_FILE || '' }}
          OMNI_MCP_STAGING_READ_TOKEN: ${{ matrix.platform == 'linux' && secrets.OMNI_MCP_STAGING_READ_TOKEN || '' }}
          OMNI_MCP_STAGING_WRITE_TOKEN: ${{ matrix.platform == 'linux' && secrets.OMNI_MCP_STAGING_WRITE_TOKEN || '' }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
