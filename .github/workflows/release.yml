  vpn_container:
    name: Managed VPN container E2E (${{ matrix.kernel_state }})
    needs: [resolve, validate, downloads, windows_download, ios, package_signatures, apple_testflight, installation]
    if: github.repository == 'omnisolo-llc/leapterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only && inputs.release_route == 'legacy-acceptance'
    environment: vpn-container
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ${{ format('vpn-container-{0}', matrix.kernel_state) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel_state: present
            runner: ubuntu-24.04
          - kernel_state: absent
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify isolated Linux container prerequisites and kernel state
        run: |
          set -euo pipefail
          docker info >/dev/null 2>&1
          test -c /dev/net/tun
          case "$LEAP_VPN_E2E_KERNEL_MODULE_STATE" in
            present) test -d /sys/module/wireguard ;;
            absent) test ! -d /sys/module/wireguard ;;
            *) exit 1 ;;
          esac
