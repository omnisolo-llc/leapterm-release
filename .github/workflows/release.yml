    if: github.repository == 'omnisolo-llc/leapterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only && inputs.release_route == 'legacy-acceptance'
    environment: external-tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ${{ matrix.platform == 'linux' && 'leapterm-mcp-candidate-staging' || format('external-tests-{0}', matrix.platform) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            config_variable: LEAP_EXTERNAL_CONFIG_LINUX
            candidate_guard_variable: LEAP_EXTERNAL_CANDIDATE_GUARD_CONFIG_LINUX
          - platform: macos
            runner: macos-26
            config_variable: LEAP_EXTERNAL_CONFIG_MACOS
            candidate_guard_variable: LEAP_EXTERNAL_CANDIDATE_GUARD_CONFIG_MACOS
          - platform: windows
            runner: windows-2025
            config_variable: LEAP_EXTERNAL_CONFIG_WINDOWS
            candidate_guard_variable: LEAP_EXTERNAL_CANDIDATE_GUARD_CONFIG_WINDOWS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        if: matrix.platform == 'macos'
        with:
          ruby-version: '3.4.7'
      - name: Verify trusted Ubuntu archive keyring for Linux external tests
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          grep -Eq '^ID="?ubuntu"?$' /etc/os-release
          keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg
          test -f "$keyring" && test ! -L "$keyring" && test -s "$keyring"
          test "$(dpkg-query -W -f='${Status}' ubuntu-keyring)" = 'install ok installed'
          dpkg-query -S "$keyring" | grep -Eq '^ubuntu-keyring(:[^:]*)?: /usr/share/keyrings/ubuntu-archive-keyring[.]gpg$'
          verify_output="$(dpkg --verify ubuntu-keyring)"
          test -z "$verify_output"
          sudo -n true
          command -v gpgv >/dev/null || { echo 'gpgv is required to update the trusted Ubuntu package index' >&2; exit 1; }
          sudo -n apt-get update
      - name: Provision Linux native external-test host prerequisites
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo -n apt-get install -y --no-install-recommends \
            bash \
            coreutils \
            g++ \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            gnupg \
            gpgv \
            libglib2.0-dev \
            openjdk-17-jdk-headless \
            pkg-config
      - name: Verify Linux native external-test host prerequisites
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          for tool in bash g++ x86_64-w64-mingw32-g++ x86_64-w64-mingw32-gcc \
            gpg gpgconf gpgv java javac pkg-config cargo rustc sha256sum; do
            command -v "$tool" >/dev/null || { echo "missing protected native host prerequisite: $tool" >&2; exit 1; }
          done
          pkg-config --exists gio-unix-2.0
          java_version="$(java -version 2>&1)"
          javac_version="$(javac -version 2>&1)"
          grep -Eq 'version "17([.]|")' <<< "$java_version"
          grep -Eq '^javac 17([.]|$)' <<< "$javac_version"
          keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg
          test -f "$keyring" && test ! -L "$keyring" && test -s "$keyring"
          test "$(dpkg-query -W -f='${Status}' ubuntu-keyring)" = 'install ok installed'
          dpkg-query -S "$keyring" | grep -Eq '^ubuntu-keyring(:[^:]*)?: /usr/share/keyrings/ubuntu-archive-keyring[.]gpg$'
          verify_output="$(dpkg --verify ubuntu-keyring)"
          test -z "$verify_output"
          ubuntu_archive_signer=F6ECB3762474EDA9D21B7022871920D1991BC93C
          found_inrelease=0
          for metadata in /var/lib/apt/lists/*_dists_*_InRelease; do
            test -f "$metadata" && test -s "$metadata" || continue
            if signature_status="$(gpgv --status-fd 1 --keyring "$keyring" "$metadata" 2>/dev/null)"; then
              if grep -Eq "^\\[GNUPG:\\] VALIDSIG ${ubuntu_archive_signer} " <<< "$signature_status"; then
                found_inrelease=1
                break
              fi
            fi
          done
          test "$found_inrelease" -eq 1
      - name: Execute exact external cases against real candidate and providers
        run: bash ci/native-release/run.sh run
        env:
          RELEASE_TARGET: external-tests
          LEAPTERM_VPN_PROVIDER_PUBLIC_KEY: ${{ vars.LEAPTERM_VPN_PROVIDER_PUBLIC_KEY }}
