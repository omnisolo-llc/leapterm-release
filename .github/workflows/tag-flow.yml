name: Tag Flow Release Dispatcher

on:
  push:
    tags:
      - 'v*'
      - 'track-*'

permissions:
  contents: read
  actions: write

jobs:
  dispatch_tag_release:
    name: Dispatch release for tag (${{ github.ref_name }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Dispatch release workflow for target track
        run: node ci/tag-flow-dispatch.mjs
        env:
          PRIVATE_RELEASE_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
