name: Omni Agent Native Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-agent:
    if: github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main'
    environment: downloads
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            artifact_scope: agent-linux-x86-64
            target: linux
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            artifact_scope: agent-linux-aarch64
            target: linux
          - runner: macos-15-intel
            platform: darwin-x86_64
            artifact_scope: agent-darwin-x86-64
            target: macos
          - runner: macos-26
            platform: darwin-aarch64
            artifact_scope: agent-darwin-aarch64
            target: macos
          - runner: windows-2025
            platform: windows-x86_64
            artifact_scope: agent-windows-x86-64
            target: windows
          - runner: windows-11-arm
            platform: windows-aarch64
            artifact_scope: agent-windows-aarch64
            target: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Provision pinned native Windows installer tooling
        if: startsWith(matrix.platform, 'windows-')
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/agent-wix" wix --version 6.0.2
          "$RUNNER_TEMP/agent-wix/wix.exe" extension add -g WixToolset.UI.wixext/6.0.2
          "$RUNNER_TEMP/agent-wix/wix.exe" extension add -g WixToolset.BootstrapperApplications.wixext/6.0.2
          printf 'OMNI_AGENT_WIX=%s/agent-wix/wix.exe\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Read the pinned agent source
        id: approved
        run: bash ci/native-release/run.sh agent-source
      - name: Build actual private source on the matching native runner
        run: bash ci/native-release/run.sh agent-run
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_REQUEST: '{"build_only":true,"source_sha":"${{ steps.approved.outputs.source_sha }}","version":"${{ steps.approved.outputs.version }}","build_number":"1","ios_action":"skip","automatic_release":false,"include_selfhost":true}'
          RESOLVED_SOURCE_SHA: ${{ steps.approved.outputs.source_sha }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ steps.approved.outputs.source_branch }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          SOURCE_SUBMODULE_DEPLOY_KEY_BASE64: ${{ secrets.SOURCE_SUBMODULE_DEPLOY_KEY_BASE64 }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.OMNI_AGENT_DIAGNOSTICS_PUBLIC_KEY }}
          OMNI_AGENT_PLATFORM: ${{ matrix.platform }}
          OMNI_AGENT_OUTPUT: ${{ runner.temp }}/agent-release
      - name: Require every platform package and verify exact output hashes
        run: |
          bash ci/native-release/run.sh verify-agent-handoff --directory "$RUNNER_TEMP/agent-release" \
            --version '${{ steps.approved.outputs.version }}' --platform '${{ matrix.platform }}'
      - name: Retain the complete native candidate privately
        run: bash ci/native-release/run.sh retain-artifacts
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_REQUEST: '{"build_only":true,"source_sha":"${{ steps.approved.outputs.source_sha }}","version":"${{ steps.approved.outputs.version }}","build_number":"1","ios_action":"skip","automatic_release":false,"include_selfhost":true}'
          RESOLVED_SOURCE_SHA: ${{ steps.approved.outputs.source_sha }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ steps.approved.outputs.source_branch }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          SOURCE_SUBMODULE_DEPLOY_KEY_BASE64: ${{ secrets.SOURCE_SUBMODULE_DEPLOY_KEY_BASE64 }}
          STORAGE_CONFIG: ${{ secrets.OMNI_AGENT_STORAGE_CONFIG }}
          OMNI_AGENT_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARTIFACT_KIND: agent-packages
          RELEASE_ARTIFACT_SCOPE: ${{ matrix.artifact_scope }}
      - name: Retain encrypted agent diagnostics privately
        if: always()
        run: bash ci/native-release/run.sh retain-artifacts
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_REQUEST: '{"build_only":true,"source_sha":"${{ steps.approved.outputs.source_sha }}","version":"${{ steps.approved.outputs.version }}","build_number":"1","ios_action":"skip","automatic_release":false,"include_selfhost":true}'
          RESOLVED_SOURCE_SHA: ${{ steps.approved.outputs.source_sha }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ steps.approved.outputs.source_branch }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          SOURCE_SUBMODULE_DEPLOY_KEY_BASE64: ${{ secrets.SOURCE_SUBMODULE_DEPLOY_KEY_BASE64 }}
          STORAGE_CONFIG: ${{ secrets.OMNI_AGENT_STORAGE_CONFIG }}
          OMNI_AGENT_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARTIFACT_KIND: diagnostics
          RELEASE_ARTIFACT_SCOPE: ${{ matrix.artifact_scope }}
