name = "omniterm-free-relay"
main = "src/index.js"
compatibility_date = "2026-09-18"
workers_dev = true

# SQLite-backed Durable Objects are supported on the Workers Free plan.
[durable_objects]
bindings = [{ name = "NATIVE_CONNECTORS", class_name = "NativeConnectorRelay" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NativeConnectorRelay"]

# Set RELAY_AUTH_TOKEN with: npx wrangler secret put RELAY_AUTH_TOKEN
# Never add real tokens, account credentials, or private keys to this file.

[vars]
# Explicit opt-in only after issuer configuration and a real relay-only peer test.
# Issuer secrets belong in Wrangler secrets, not here.
RELAY_TURN_ENABLED = "false"
# Add exact browser application HTTPS origins to NATIVE_RELAY_BROWSER_ORIGINS.
NATIVE_RELAY_BROWSER_ORIGINS = ""
# Native RTC is opt-in and requires a separately deployed matching ingress.
NATIVE_PUBLIC_RTC_ENABLED = "false"
NATIVE_RTC_INGRESS = ""
# Store NATIVE_RTC_SERVICE_TOKEN as a secret distinct from relay/operator tokens.
