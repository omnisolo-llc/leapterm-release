[package]
name = "leap-release-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[[bin]]
name = "contract-child"
path = "tests/fixtures/child.rs"
test = false

[[bin]]
name = "source-api-fixture"
path = "tests/fixtures/source_api.rs"
test = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha1 = "=0.10.7"
base64 = "=0.23.1"
tempfile = "=3.27.0"
sha2 = "=0.10.9"
libc = "=0.2.186"
signal-hook = "=0.3.18"

# Used by the bounded offline runner-policy audit and workflow contract tests.
serde_yaml = "=0.9.34"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Security"] }
